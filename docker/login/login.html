<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ILD SemiSeg Tool - Sign in</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: #090c29; color: #e5e7eb;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: 100%; max-width: 360px; background: #0d1340; border: 1px solid #1f2a6b; border-radius: 10px; padding: 28px; }
    h1 { margin: 0 0 4px; font-size: 20px; color: #5acce6; }
    p.sub { margin: 0 0 22px; color: #9ca3af; font-size: 13px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; color: #cbd5e1; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #2b3a8c;
      background: #060820; color: #fff; font-size: 15px;
    }
    input:focus { outline: 2px solid #5acce6; outline-offset: 1px; }
    button {
      width: 100%; margin-top: 22px; padding: 11px; border: 0; border-radius: 6px;
      background: #5acce6; color: #04102b; font-weight: 600; font-size: 15px; cursor: pointer;
    }
    button:hover { background: #7ad8ee; }
    .error { margin: 16px 0 0; padding: 9px 12px; border-radius: 6px; background: #4c1020; color: #fecaca; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>ILD SemiSeg Tool</h1>
    <p class="sub">Sign in to view and annotate your studies.</p>
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{next}}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      {{error}}
    </form>
  </main>
</body>
</html>
